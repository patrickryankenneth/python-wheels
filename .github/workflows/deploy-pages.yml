name: Universal Pages Deployer

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write # Needed to mirror index.html for Vercel/Cloudflare if non-custom
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false # Prevents corrupted CDN deployments

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      is_custom: ${{ steps.site-detect.outputs.is_custom }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.x"

      - name: Prepare site payload (Smart Detect)
        id: site-detect
        env:
          REPO_NAME: ${{ github.repository }}
        run: |
          pip install markdown==3.7
          python3 - << 'EOF'
          import os
          import shutil
          import subprocess
          import markdown

          repo_name = os.environ.get("REPO_NAME", "Repository").split("/")[-1]
          os.makedirs("_site", exist_ok=True)

          # Check if an index.html exists and is not auto-generated
          has_custom_site = False
          if os.path.exists("index.html"):
              with open("index.html", "r", encoding="utf-8", errors="ignore") as f:
                  if "<!-- auto-generated-from-readme -->" not in f.read():
                      has_custom_site = True

          if has_custom_site:
              print(f"::notice::[CUSTOM SITE] Preserving committed site assets for {repo_name}.")
              # SECURE: Only copy tracked Git files; skip .github/ and root README/SECURITY metadata
              tracked = subprocess.check_output(["git", "ls-files"], text=True).splitlines()
              for f in tracked:
                  if f.startswith(".github/") or f in {".gitignore", "SECURITY.md"}:
                      continue
                  dst = os.path.join("_site", f)
                  os.makedirs(os.path.dirname(dst), exist_ok=True)
                  shutil.copy2(f, dst)

              with open(os.environ["GITHUB_OUTPUT"], "a") as gh_out:
                  gh_out.write("is_custom=true\n")

          else:
              print(f"::notice::[NO CUSTOM SITE] Generating static HTML from README.md for {repo_name}...")
              content = ""
              if os.path.exists("README.md"):
                  with open("README.md", "r", encoding="utf-8") as f:
                      content = f.read()
              else:
                  content = f"# {repo_name}\n\nAutomated documentation build."

              body = markdown.markdown(content, extensions=["tables", "fenced_code", "toc"])

              html = f"""<!DOCTYPE html>
          <!-- auto-generated-from-readme -->
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>{repo_name}</title>
            <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/github-markdown-css/5.8.1/github-markdown.min.css">
            <style>
              body {{
                box-sizing: border-box;
                min-width: 200px;
                max-width: 980px;
                margin: 0 auto;
                padding: 45px;
              }}
              @media (max-width: 767px) {{
                body {{
                  padding: 15px;
                }}
              }}
            </style>
          </head>
          <body class="markdown-body">
          {body}
          </body>
          </html>
          """
              with open("_site/index.html", "w", encoding="utf-8") as out:
                  out.write(html)

              with open(os.environ["GITHUB_OUTPUT"], "a") as gh_out:
                  gh_out.write("is_custom=false\n")
          EOF

          touch _site/.nojekyll

      # Defensive check: ensure index.html was created before attempting to upload
      - name: Validate build payload
        run: |
          if [ ! -f "_site/index.html" ]; then
            echo "::error::Build failed to generate _site/index.html"
            exit 1
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5

  # Runs LAST so branch protection or push errors never block the live site deployment
  sync-root-mirror:
    needs: [build, deploy]
    if: needs.build.outputs.is_custom == 'false'
    runs-on: ubuntu-latest
    continue-on-error: true # Non-blocking if branch protection prevents direct pushes
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Download built site artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.1.8
        with:
          name: github-pages
          path: .

      - name: Extract and mirror index.html for Vercel/Cloudflare
        run: |
          tar -xf artifact.tar -C .
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html

          if ! git diff --staged --quiet; then
            # GITHUB_TOKEN pushes do not trigger recursive runs, but [skip ci] is added for clarity
            git commit -m "docs: sync root index.html with README [skip ci]"
            git push
          fi
