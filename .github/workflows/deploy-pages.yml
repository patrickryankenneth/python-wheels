name: Deploy README to GitHub Pages & Static Hosts

on:
  push:
    branches:
      - main
    paths:
      - "README.md"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: write # Needed to commit index.html to the repo for Vercel/Cloudflare
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.x"

      - name: Convert README.md to HTML
        env:
          REPO_NAME: ${{ github.repository }}
        run: |
          pip install markdown
          python3 - << 'EOF'
          import os
          import markdown

          repo_name = os.environ.get("REPO_NAME", "Repository")

          with open("README.md", "r", encoding="utf-8") as f:
              content = f.read()

          body = markdown.markdown(content, extensions=["tables", "fenced_code", "toc"])

          html = f"""<!DOCTYPE html>
          <!-- auto-generated-from-readme -->
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>{repo_name}</title>
            <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/github-markdown-css/5.8.1/github-markdown.min.css">
            <style>
              body {{
                box-sizing: border-box;
                min-width: 200px;
                max-width: 980px;
                margin: 0 auto;
                padding: 45px;
              }}
              @media (max-width: 767px) {{
                body {{
                  padding: 15px;
                }}
              }}
            </style>
          </head>
          <body class="markdown-body">
          {body}
          </body>
          </html>
          """

          os.makedirs("_site", exist_ok=True)
          with open("_site/index.html", "w", encoding="utf-8") as out:
              out.write(html)
          EOF

          touch _site/.nojekyll

      # If there is NO index.html, OR if the index.html was auto-generated by this action,
      # sync it so Vercel / Cloudflare Pages can serve it directly from the repo root.
      - name: Sync root index.html for Vercel / Cloudflare
        run: |
          SHOULD_SYNC=false

          if [ ! -f "index.html" ]; then
            echo "No root index.html found. Creating from README..."
            SHOULD_SYNC=true
          elif grep -q "<!-- auto-generated-from-readme -->" index.html; then
            echo "Existing index.html is auto-generated. Updating..."
            SHOULD_SYNC=true
          else
            echo "A custom index.html already exists. Skipping overwrite to protect custom code."
          fi

          if [ "$SHOULD_SYNC" = "true" ]; then
            cp _site/index.html index.html
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add index.html

            # Only commit if the HTML actually changed
            if ! git diff --staged --quiet; then
              git commit -m "docs: sync root index.html with README [skip ci]"
              git push
            else
              echo "Root index.html is already up-to-date."
            fi
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
